<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>力学实验台</title><link rel="stylesheet" href="/style.css"><style>
body{padding:24px;background:#fff}main{padding:0;margin:0}.bench-layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:22px}.apparatus{background:#f4f9f8;border:1px solid #dce9e5;border-radius:16px;padding:12px}svg{width:100%;min-height:240px;display:block}.controls{display:grid;gap:14px}.control-heading{display:flex;justify-content:space-between;gap:10px}.control-heading output{font-weight:700;color:#147d78}input[type=range]{padding:0;width:100%;accent-color:#147d78}.readouts{display:flex;flex-wrap:wrap;gap:16px;margin:16px 0}.reading{min-width:115px;border-left:3px solid #79b7a7;padding-left:10px}.reading b{display:block;font-size:21px;color:#147d78}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.measurement{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.measurement label{min-width:240px}.warning{color:#a75420;min-height:24px}table{font-size:13px}.boundary{font-size:13px;line-height:1.8}#message{display:block;min-height:24px;margin-top:10px}@media(max-width:780px){body{padding:12px}.bench-layout{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.control-heading{font-size:13px}}
</style></head><body>
<h1 id="title"></h1><p id="intro" class="muted"></p>
<div class="bench-layout"><section class="apparatus"><svg id="bench" viewBox="0 0 780 350" role="img" aria-label="可调节的力学实验器材"></svg><div id="readouts" class="readouts" aria-live="off"></div><div id="warning" class="warning" role="status"></div></section><section><h3>实验条件</h3><div id="controls" class="controls"></div><div id="motion-actions" class="actions" hidden><button id="run">开始运动</button><button id="reset-run" class="secondary">重新计时</button></div></section></div>
<div class="measurement"><label><span id="measurement-label"></span><input id="measured" type="number" min="0" max="1000" step="0.01" placeholder="观察读数或计算后填写"></label><button id="record">记录测量</button><button id="csv" class="secondary">导出 CSV</button></div><span id="message" role="status"></span>
<section class="panel" style="margin-top:18px"><h2>测量记录 <span id="count" class="muted"></span></h2><div class="table-scroll"><table><thead><tr><th>序号</th><th>实验条件</th><th>仿真时间 / s</th><th>测量值</th><th>观察数据</th><th></th></tr></thead><tbody id="records"></tbody></table></div></section>
<p id="boundary" class="muted boundary"></p><script type="module" src="/experiments/mechanics.js"></script></body></html>
