<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>光学实验台</title><style>body{padding:25px;background:#fff}svg{width:100%;background:#f6faf9;border-radius:12px}main{margin:0;padding:0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0}input[type=range]{padding:0}.readouts{display:flex;gap:30px;margin:18px 0}.readouts b{font-size:24px;color:#147d78}</style></head><body><h1 id="title"></h1><p id="intro" class="muted"></p><svg id="bench" viewBox="0 0 800 370" role="img" aria-label="光路与镜面示意图"></svg><div class="readouts"><div>实验条件<br><b id="condition"></b></div><div>观察现象<br><b id="observation"></b></div></div><div class="controls"><label><span id="parameter-label"></span><input id="parameter" type="range"></label><label id="measurement-label">手动填写测量值<input id="measurement" type="number" step="1" placeholder="从图中观察并输入"></label></div><button id="record">记录测量</button><span id="message" role="status"></span><section class="panel" style="margin-top:20px"><h2>实验记录</h2><table><thead><tr><th>序号</th><th id="input-column"></th><th id="output-column"></th><th>测量值</th></tr></thead><tbody id="records"></tbody></table></section><p class="muted" id="boundary"></p><script src="/experiments/optics.js"></script></body></html>
