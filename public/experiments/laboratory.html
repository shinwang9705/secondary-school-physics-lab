<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交互物理实验台</title><link rel="stylesheet" href="/style.css"><style>
body{background:white;padding:22px}h1{font-size:25px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.apparatus{padding:12px;background:#f4f9f6;border-radius:14px;border:1px solid #dbe8e1}svg{display:block;width:100%}.controls{display:grid;gap:10px}.control{border-bottom:1px solid #edf1ed;padding-bottom:8px}.pair{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:center}.pair input[type=range]{padding:0;accent-color:#16877d}input[type=number]{padding:7px}.readouts{display:flex;gap:15px;flex-wrap:wrap;margin:12px 0}.reading{border-left:3px solid #7abb9c;padding-left:10px;min-width:105px}.reading b{display:block;color:#147d78;font-size:20px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}.measurements{display:flex;flex-wrap:wrap;gap:14px;align-items:end;margin:18px 0}.measurements label{min-width:160px;flex:1}.warning{color:#aa6e2e;min-height:24px;margin-top:8px}.table-scroll table{min-width:620px}td,th{font-size:12px}.toolbar{display:flex;gap:15px;flex-wrap:wrap}.toolbar label{min-width:160px}.boundary{font-size:13px;line-height:1.8}.boundary b{color:#28524c}textarea{min-height:90px}.stepper{max-width:170px}#graph{min-height:180px}.analysis{display:flex;gap:12px;margin:15px 0}#message{min-height:22px;color:#876428}@media(max-width:800px){body{padding:12px}.layout{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}.pair{grid-template-columns:1fr}.control label{font-size:12px}}
</style></head><body><h1 id="title"></h1><p id="goal" class="muted"></p><div class="layout"><section class="apparatus"><svg id="bench" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 410" role="img" aria-label="实验器材与测量刻度"></svg><div id="readouts" class="readouts"></div><div id="warning" class="warning" role="status"></div></section><section><h3>调整器材</h3><div id="controls" class="controls"></div></section></div>
<section id="clock"><div class="actions"><button id="run">开始 / 继续</button><button id="step" class="secondary">前进 0.1 秒</button><button id="reset-time" class="secondary">重新计时</button><label class="stepper">定位仿真时刻 / s<input id="seek" type="number" min="0"></label></div><p class="muted" id="clock-info"></p></section>
<div id="measurements" class="measurements"></div><div class="actions"><button id="record">记录测量</button><button id="csv" class="secondary">导出 CSV</button><button id="reset" class="secondary">重置器材（保留记录）</button></div><p id="message" role="status"></p>
<section class="panel"><h2>测量记录 <span id="count" class="muted"></span></h2><div class="table-scroll"><table><thead id="table-head"></thead><tbody id="records"></tbody></table></div></section>
<section class="panel"><h2>用数据分析规律</h2><div class="toolbar"><label>横轴<select id="graph-x"></select></label><label>纵轴<select id="graph-y"></select></label><button id="fit" class="secondary">拟合直线</button></div><svg id="graph" viewBox="0 0 800 240" role="img" aria-label="记录数据散点图"></svg><p id="fit-result" class="muted"></p><div id="analysis" class="analysis" hidden><label>拟合电动势 E / V<input id="analysis-emf" type="number" step="0.01"></label><label>拟合内阻 r / Ω<input id="analysis-internal" type="number" step="0.01"></label></div><label>实验结论与误差分析<textarea id="conclusion" maxlength="2000" placeholder="根据多组数据说明规律、适用条件和误差来源。文字结论由教师复核。"></textarea></label></section>
<p id="boundary" class="muted boundary"></p><script type="module" src="/experiments/laboratory.js"></script></body></html>
