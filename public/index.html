<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物理实验室 · 探索与验证</title><link rel="stylesheet" href="/style.css"></head><body><aside class="sidebar"><a class="brand" href="/">◈ <span>物理实验室<small>PHYSICS LAB</small></span></a><p class="nav-label">学习空间</p><button data-nav="catalog" class="active">◫ 实验目录</button><button data-nav="records">▤ 实验记录</button><button data-nav="tasks">⌁ 班级任务</button><button data-nav="manage" id="manage-nav" hidden>⚙ 账号与班级</button><div class="sidebar-bottom"><span class="status-dot"></span> 本地实验平台<br><small>平台 v1.0 · 42 项教学实验</small><div id="identity"></div><button id="change-password">修改密码</button><button id="logout" hidden>退出登录</button></div></aside><main><header><div><span class="eyebrow">探索 · 测量 · 验证</span><h1 id="page-title">让物理规律，看得见</h1></div><span class="pill">中学物理 / 虚拟仿真</span></header><div id="notice" role="status" hidden></div><section id="auth-view" hidden></section><section class="panel" id="password-panel" hidden><h2>修改密码</h2><form id="password-form" class="form-grid"><label>当前密码<input type="password" name="oldPassword" required autocomplete="current-password"></label><label>新密码<input type="password" name="newPassword" minlength="10" maxlength="128" required autocomplete="new-password"></label><button>修改并重新登录</button></form></section><section id="content"></section><section id="lab-view" hidden><div class="lab-head"><button id="back" class="secondary">← 返回目录</button><div><h2 id="lab-title"></h2><p id="lab-goal"></p></div><span id="save-state">准备中</span></div><div class="lab-actions"><button id="undo" class="secondary">撤销</button><button id="redo" class="secondary">重做</button><button id="save" class="secondary">保存实验</button><button id="submit">提交并检查</button><button id="replay" class="secondary">历史回放</button><button id="capture-frame" class="secondary">保存关键帧</button><select id="report-format" aria-label="报告格式"><option value="json">JSON</option><option value="csv">CSV</option><option value="html">HTML / 打印</option><option value="pdf">PDF</option></select><button id="download-report" class="secondary" hidden>导出报告</button></div><section class="panel" id="replay-panel" hidden><p id="replay-label"></p><input id="replay-index" type="range" min="0" value="0" step="1" aria-label="历史修订"><button id="play-replay">播放</button><button id="close-replay" class="secondary">结束回放</button><p>按保存修订回放；不包含修订之间的连续动作。回放不会改写原始记录。</p></section><iframe id="experiment-frame" title="交互实验台"></iframe><div id="keyframe-gallery" class="keyframes"></div><section class="panel"><button id="explain" class="secondary">获取教学解释</button><label class="inline"><input type="checkbox" id="external-ai">使用已配置外部 AI（仅发送实验名称和检查项，不发送账号、记录或图片）</label><p id="explanation-text"></p></section><section id="feedback" class="panel" hidden></section></section><footer>用实验发现规律。模型简化与判定范围见实验说明。</footer></main><script type="module" src="/app.js"></script></body></html>
